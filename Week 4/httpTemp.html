<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function calculateSum(a, b) {
            let sum = parseInt(a) + parseInt(b);
            return sum;
        }
        let ans = calculateSum(1, 3);
        document.body.innerHTML = ans;
        
    </script>
</body>
