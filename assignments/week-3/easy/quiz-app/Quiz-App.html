<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        main {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            width: 900px;
            height: 600px;
            border: 2px solid black;
            box-shadow: 1px 1px 5px 7px lightblue;
            border-radius: 15px;
            background-color: aliceblue;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: column;
        }

        .question {
            margin: 37px auto 0px auto;
        }

        .answer-option {
            display: flex;
            width: 90%;
            height: 50%;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .answer-option div {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        .submit {
            width: 90%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #next-btn {
            border: 2px solid black;
            padding: 9px 40px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            background-color: #d0f3ff;
        }
        #next-btn:hover {
            background-color: #76ddff;
        }
    </style>
</head>
<body>
