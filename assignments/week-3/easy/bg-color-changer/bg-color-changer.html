<!-- 
# BG-Color-Changer

Your task is to design and implement a Bg-Color-Changer application that meets the following requirements:

- The UI should resemble the example shown below..

![Image](https://utfs.io/f/7e57da15-803c-48c7-8487-dcade58eef91-wx71zg.png)


- When user clicks on a red button, the background color should change to red.


- User should also be able to add custom colors to the color panel.


### Don't copy UI as it is, only take reference from it. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG-Color-Changer</title>
    <style>
        nav {
            display: flex;
            justify-content: center;
            align-items: end;
            height: 90vh;
            gap: 60px;
        }
        nav div {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 110px;
            height: 30px;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid orange;
        }
        
        #custom {
            background-color: rgb(231, 205, 170);
        }
        #red {
            background-color: red;
        }
        #blue {
            background-color: blue;
        }
        #yellow {
            background-color: yellow;
        }
        #black {
            background-color: black;
            color: white;
        }
        #purple {
            background-color: purple;
        }
        #green {
            background-color: green;
        }
    </style>
</head>
<body>
    <nav>
        <div id="custom" onclick="customColor()">Custom Color</div>
        <div id="red" onclick="redColor()">Red</div>
        <div id="blue" onclick="blurColor()">Blue</div>
        <div id="yellow" onclick="yellowColor()">Yellow</div>
        <div id="black" onclick="blackColor()">Black</div>
        <div id="purple" onclick="purpleColor()">Purple</div>
        <div id="green" onclick="greenColor()">Green</div>
    </nav>

    <script>
        function customColor() {
            let colorName = prompt("Enter Color Name");

            document.body.style.backgroundColor = `${colorName}`;
        }
        function redColor() {
            document.body.style.backgroundColor = "red";
        }
        function blurColor() {
            document.body.style.backgroundColor = "blue";
        }
        function yellowColor() {
            document.body.style.backgroundColor = "yellow";
        }
        function blackColor() {
            document.body.style.backgroundColor = "black";
        }
        function purpleColor() {
            document.body.style.backgroundColor = "purple";
        }
        function greenColor() {
            document.body.style.backgroundColor = "green";
        }
    </script>
</body>
</html>
