# The-Pokémon

Your task is to design and implement an application that display Pokémon Cards.

- user comes to site and enter number of cards and select category of Pokémon.

**Hint**: take category and no of Pokémon, use API and render.

- refer this: https://pokeapi.co/
- use this `https://pokeapi.co/api/v2/pokemon/${id}` api to get the pokemon data by id.

     <script>
        let submitButton = document.querySelector("#submitBtn");

        submitButton.addEventListener("click", async () => {
            let inputButton = document.querySelector("input");
            let valueId = inputButton.value;

            let fetchPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${valueId}`)
            let response = await fetchPokemon.json();

            let pokemonImg = document.querySelector("img");
            pokemonImg.src = "";
            pokemonImg.src = `${response.sprites.front_shiny}`

            let pokemonName = document.querySelector("h2")
            pokemonName.innerHTML = `${response.name}`

            console.log(response);

            let pokemonId = document.querySelector("#pokemonId");
            pokemonId.innerHTML = `The Id is : ${response.id}`;

            let pokemonType = document.querySelector("#pokemonType");
            pokemonType.innerHTML = `Type of The Pokemon is : ${response.types[0].type.name}`;
            
            let pokemonAbility = document.querySelector("#pokemonAbility");
            pokemonAbility.innerHTML = `The Ability is : ${response.abilities[0].ability.name}`;

            let pokemonHeight = document.querySelector("#pokemonHeight");
            pokemonHeight.innerHTML = `Height of the Pokemon is : ${response.height} Inches`;
        })
